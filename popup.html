<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>

<p>Language:</p>
<select id="langFilter"></select>

<p>Voice:</p>
<select id="voice"></select>
<button id="preview">Preview</button>

<p id="rateLabel">Rate:</p>
<input type="range" id="rate" min="0.1" max="10" step="0.1" value="1">

<p id="pitchLabel">Pitch:</p>
<input type="range" id="pitch" min="0" max="2" step="0.1" value="1">

<p id="volumeLabel">Volume:</p>
<input type="range" id="volume" min="0" max="1" step="0.1" value="1">

<hr/>
<button id="toggle">Enable/Disable</button>
<button id="pause">Pause</button>
<p id="status">Status: Enabled</p>
<p>Hotkey: Ctrl+Shift+Y</p>

<hr/>
<p id="versionStamp">GrayTTS<br>
Made by ChatGPT and Grayson Chalmers</p>

<script src="popup.js"></script>

</body>
</html>
